<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IT Field Manual</title>
<meta name="description" content="Offline-first personal IT field manual: commands, lessons, labs and troubleshooting for A+, Cisco/CCNA, MikroTik, Windows 11, Windows Server and RHEL 10.">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="assets/app.css">

<!-- Self-hosted fonts, preloaded so the first paint is already in the right
     typeface. Same origin as everything else, so they work offline once the
     service worker has cached them - there is no third-party request anywhere
     in this app's critical path. -->
<link rel="preload" href="fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>

<header class="topbar">
  <button class="topbar__menu" id="menuBtn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidenav">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <div class="topbar__brand">
    <span class="topbar__mark" aria-hidden="true"></span>
    <span class="topbar__title">IT Field Manual</span>
  </div>

  <form class="search" id="searchForm" role="search" autocomplete="off">
    <label class="visually-hidden" for="q">Search everything — commands, lessons, lab steps, troubleshooting, quizzes and all 146 Knowledge Map sessions</label>
    <input id="q" name="q" type="search" placeholder="Search everything…"
           aria-describedby="searchHint" enterkeyhint="search" spellcheck="false" autocomplete="off">
    <button type="button" class="search__clear" id="searchClear" hidden aria-label="Clear search">&times;</button>
  </form>
  <p id="searchHint" class="visually-hidden">Searches every command, lesson, lab step, troubleshooting entry, quiz question and Knowledge Map session. Results filter as you type. Press slash to focus, Escape to clear.</p>

  <div class="topbar__actions">
    <button class="icon-btn" id="langBtn" aria-label="Translate this page" title="Translate" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.5 3.8 5.6 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3z"/></svg>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle colour theme" title="Toggle theme">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-sun"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-moon"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
    <button class="icon-btn" id="dataBtn" aria-label="My data: export, import, progress" title="My data">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
    </button>
  </div>
</header>

<div class="layout">

  <nav class="sidenav" id="sidenav" aria-label="Sections">
    <div class="sidenav__scroll">

      <!--
        Structure, top level first:

          Home                            link, flush left
          Subjects          (accordion)   RHEL .. CompTIA A+
          Practice          (accordion)   Troubleshooting .. Knowledge Map
          Reference         (accordion)   Simple Notes .. Verification status
          My progress                     link, flush left
          Quizzes / Projects / Bookmarks  links, flush left

        The group labels are NOT boxes, and not buttons that look like links.
        The previous version gave each group a bordered panel with its own
        hover state, which made the headings read as clickable items that
        happened to be full width - and there was then no way to tell a
        section header from a destination. They are now plain uppercase text
        with a small chevron, and the chevron is the only control-shaped thing.
      -->
      <ul class="sidenav__list sidenav__list--top" id="navTop"></ul>

      <section class="sidenav__block" data-group="subjects">
        <h2 class="sidenav__group">
          <button class="sidenav__toggle" type="button" aria-expanded="true" aria-controls="navSubjects">
            <span class="sidenav__chev" aria-hidden="true"></span>
            <span class="sidenav__gname">Subjects</span>
          </button>
        </h2>
        <ul class="sidenav__list sidenav__list--sub" id="navSubjects"></ul>
      </section>

      <section class="sidenav__block" data-group="practice">
        <h2 class="sidenav__group">
          <button class="sidenav__toggle" type="button" aria-expanded="true" aria-controls="navPractice">
            <span class="sidenav__chev" aria-hidden="true"></span>
            <span class="sidenav__gname">Practice</span>
          </button>
        </h2>
        <ul class="sidenav__list sidenav__list--sub" id="navPractice"></ul>
      </section>

      <section class="sidenav__block" data-group="reference">
        <h2 class="sidenav__group">
          <button class="sidenav__toggle" type="button" aria-expanded="true" aria-controls="navProject">
            <span class="sidenav__chev" aria-hidden="true"></span>
            <span class="sidenav__gname">Reference</span>
          </button>
        </h2>
        <ul class="sidenav__list sidenav__list--sub" id="navProject"></ul>
      </section>

      <ul class="sidenav__list sidenav__list--top sidenav__list--top2" id="navTop2"></ul>

      <div class="sidenav__foot">
        <div class="netstat" id="netstat" aria-live="polite"></div>
      </div>
    </div>
  </nav>

  <div class="scrim" id="scrim" hidden></div>

  <main id="main" class="main" tabindex="-1"></main>

</div>

<div class="toast-host" id="toastHost" aria-live="polite" aria-atomic="false"></div>

<div class="sheet-host" id="sheetHost" hidden></div>

<footer class="appfoot">
  <span id="buildInfo"></span>
  <span class="appfoot__sep">•</span>
  <span>All personal data stays on this device.</span>
</footer>

<script type="module" src="assets/app.js"></script>
</body>
</html>
