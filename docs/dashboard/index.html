<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Field Manual — DevStudy Hub</title>
<meta name="description" content="Three-panel developer study dashboard and e-reader: navigation tree, reading workspace, and an interactive practice drawer.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="appbar">
  <div class="appbar__left">
    <button class="iconbtn only-mobile" id="openLeft" aria-label="Open navigation">&#9776;</button>
    <div class="brand">
      <span class="brand__mark" aria-hidden="true">IF</span>
      <span class="brand__text">
        <strong>IT Field Manual</strong>
        <small>DevStudy Hub</small>
      </span>
    </div>
  </div>

  <div class="appbar__center">
    <form class="globalsearch" role="search" autocomplete="off" onsubmit="return false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="globalSearch" type="search" placeholder="Search commands, lessons and labs…" aria-label="Global search" enterkeyhint="search">
      <kbd>/</kbd>
    </form>
    <div class="searchres" id="searchResults" role="listbox" hidden></div>
  </div>

  <div class="appbar__right">
    <div class="who" title="Reading progress">
      <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
        <circle class="ring__track" cx="18" cy="18" r="15.5"></circle>
        <circle class="ring__value" id="ringValue" cx="18" cy="18" r="15.5"></circle>
      </svg>
      <span class="ring__label" id="ringLabel">0%</span>
    </div>
    <div class="avatar" title="Your profile" aria-label="Your profile">SS</div>
    <button class="iconbtn" id="themeToggle" aria-label="Toggle colour theme" title="Toggle theme">
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>
    <button class="iconbtn only-tablet" id="openRight" aria-label="Open practice panel" title="Practice">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6v3H9z"/><path d="M9 5.5H6a1 1 0 0 0-1 1V20h14V6.5a1 1 0 0 0-1-1h-3"/><path d="M8.5 13l2.2 2.2L15.5 10.5"/></svg>
    </button>
  </div>
</header>

<div class="appbody">
  <aside class="rail rail--left" id="railLeft" aria-label="Navigation and table of contents">
    <div class="railhead">
      <div class="bookcard">
        <div class="bookcard__cover" id="bookCover" aria-hidden="true">NF</div>
        <div class="bookcard__meta">
          <strong class="bookcard__title" id="bookTitle">Network Fundamentals</strong>
          <span class="bookcard__sub" id="bookProgressText">Page 58 of 420</span>
          <div class="bar bar--accent"><i id="bookProgressBar" style="width:0%"></i></div>
        </div>
      </div>
    </div>
    <nav class="tree" id="treeNav" aria-label="Table of contents"></nav>
    <div class="quick" id="quickSwitch"></div>
  </aside>

  <main class="reader" id="readerMain">
    <div class="reader__bar">
      <div class="crumb" id="crumb">Chapter</div>
      <div class="pager" id="pager">Page 1 / 420</div>
    </div>
    <article class="doc" id="doc"></article>
  </main>

  <aside class="rail rail--right" id="railRight" aria-label="Practice">
    <section class="panel">
      <div class="panel__head">
        <h2>Quiz Center</h2>
        <span class="pill" id="quizScorePill">0 / 0</span>
      </div>
      <p class="quiz__topic" id="quizTopic">Topic</p>
      <div class="bar bar--accent"><i id="quizBar" style="width:0%"></i></div>
      <ol class="quiz" id="quizList"></ol>
      <div class="quizfoot">
        <button class="btn btn--accent" id="quizSubmit">Submit Quiz</button>
        <button class="btn" id="quizReset" hidden>Retake</button>
      </div>
      <div class="quizresult" id="quizResult" hidden></div>
    </section>

    <section class="panel panel--grow">
      <div class="panel__head">
        <h2>Lab Checklist</h2>
        <span class="pill" id="labCount">0 / 0</span>
      </div>
      <ul class="lab" id="labList"></ul>
    </section>
  </aside>
</div>

<div class="scrim" id="scrim" hidden></div>

<script src="app.js" defer></script>
</body>
</html>
